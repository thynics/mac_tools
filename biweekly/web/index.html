<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: biweekly-image:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>双周 · Biweekly</title><link rel="stylesheet" href="style.css">
<script defer src="vendor/marked.js"></script><script defer src="vendor/purify.js"></script><script defer src="model.js"></script><script defer src="markdown.js"></script><script defer src="images.js"></script><script defer src="git-ui.js"></script><script defer src="app.js"></script>
</head>
<body>
<div id="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-icon"><i></i><i></i></div><div><strong>双周</strong><span>BIWEEKLY</span></div></div>
  <button id="focus-doing" class="focus-button"><span class="status-dot doing"></span><span>专注 Doing</span><kbd>⌘ 1</kbd><b id="global-doing">0</b></button>
  <div class="section-label">工作周期 <span>14 DAYS</span></div>
  <nav id="cycles" aria-label="双周列表"></nav>
  <div class="sidebar-bottom"><div class="local-indicator"><span></span><span id="save-label" role="status">本地存储 · 自动保存</span></div><button id="git-status-btn" class="quiet full git-status">↥ 设置 Git 备份</button><button id="settings-btn" class="quiet full"><span>⚙</span> 偏好与备份 <span class="key-hint">⌘ ,</span></button></div>
</aside>
<main>
  <header class="topbar"><div class="breadcrumb">我的工作台 <span>/</span> <b id="breadcrumb-period">当前双周</b></div><div class="top-actions"><button id="import-btn" class="quiet">↓ 导入 Markdown</button><button id="export-btn" class="quiet" title="导出当前双周为 Markdown">↑ 导出</button></div></header>
  <section class="period-heading"><div class="title-line"><h1 id="period-title"></h1><span id="period-tag" class="period-tag">进行中</span><button id="archive-btn" class="quiet">归档并开启下一双周 ↗</button></div><div class="period-meta"><span id="date-range"></span><span class="meta-separator">·</span><span id="day-progress"></span><span class="meta-separator">·</span><span id="stats" class="stats"></span><button id="cycle-notes-btn" class="text-button">双周笔记 ↗</button></div>
  <div class="progress-line"><span id="progress-fill"></span></div>
  </section>
  <section class="task-section"><div class="task-toolbar"><div class="tabs" role="tablist" aria-label="任务状态"><button data-filter="all" role="tab" class="active">全部 <span></span></button><button data-filter="doing" role="tab">Doing <span></span></button><button data-filter="todo" role="tab">Todo <span></span></button><button data-filter="done" role="tab">Done <span></span></button></div><label class="search-box"><span>⌕</span><input id="search" type="search" placeholder="搜索任务…" aria-label="搜索任务"><kbd>⌘ F</kbd></label></div>
  <div id="archive-notice" hidden>这个双周已归档，保留当时的任务与笔记。你仍可以浏览和导出。</div>
  <div class="list-heading"><span>任务 / TASK</span><div class="outline-actions"><button id="expand-all">展开全部</button><span>·</span><button id="collapse-all">收起全部</button></div><span>状态</span></div>
  <div id="task-list" role="tree" aria-label="任务列表"></div>
  <form id="quick-add" class="quick-add"><span>＋</span><input id="new-task" placeholder="添加任务，按 Enter 保存…" autocomplete="off" aria-label="新任务标题"><kbd>↵</kbd></form>
  <div class="list-footer"><span>拖动 ⋮⋮ 排序 · 点击任务查看笔记</span><span id="visible-count"></span></div>
  </section>
</main>
<aside id="detail" class="detail" hidden></aside>
</div>
<dialog id="modal"><div id="modal-content"></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
